services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    volumes:
      - ./adguard-work:/opt/adguardhome/work
      - ./adguard-conf:/opt/adguardhome/conf
    networks:
      proxy_net:
        ipv4_address: 10.2.0.100
    ports:
      # AdGuard Initial Setup Wizard (Port 3000) & Admin Dashboard (Port 80/8080)
      - "3000:3000/tcp"
      - "8080:80/tcp"
      # DNS ports (accessible from localhost and Wireguard network)
      - "53:53/tcp"
      - "53:53/udp"

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: wg-easy
    restart: unless-stopped
    environment:
      # Admin password for wg-easy web UI (used to add phone and generate QR code)
      - PASSWORD=${WG_ADMIN_PASSWORD}
      # Your VPS Public IP or Domain Name
      - WG_HOST=${VPS_PUBLIC_IP}
      # WireGuard Port
      - WG_PORT=51820
      # Route mobile DNS through AdGuard Home container
      - WG_DEFAULT_DNS=10.2.0.100
      # Allowed IPs (0.0.0.0/0, ::/0 routes ALL mobile traffic through VPS)
      - WG_DEFAULT_ADDRESS=10.8.0.x
      - WG_ALLOWED_IPS=0.0.0.0/0, ::/0
      # Keepalive for mobile battery & persistent connection
      - WG_PERSISTENT_KEEPALIVE=25
    volumes:
      - ./wireguard-data:/etc/wireguard
    networks:
      proxy_net:
        ipv4_address: 10.2.0.200
    ports:
      # WireGuard VPN tunnel UDP port
      - "51820:51820/udp"
      # WireGuard Web UI (QR Code & client management)
      - "51821:51821/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    depends_on:
      - adguardhome

  god-panel:
    build:
      context: ./dashboard
    container_name: god-panel
    restart: unless-stopped
    environment:
      - PORT=8000
      - ADGUARD_HOST=http://10.2.0.100:80
      - WG_HOST=http://10.2.0.200:51821
    networks:
      proxy_net:
        ipv4_address: 10.2.0.50
    ports:
      # God-Level Cyber-Command Control Panel (Hacker Dashboard)
      - "${DASHBOARD_PORT:-8888}:8000/tcp"
    depends_on:
      - adguardhome
      - wg-easy

networks:
  proxy_net:
    name: proxy_net
    driver: bridge
    ipam:
      config:
        - subnet: 10.2.0.0/24
